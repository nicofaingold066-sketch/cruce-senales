<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // La misma clave y orden de respaldo que src/lib/tema.ts, antes del primer render.
      (() => {
        let modo = 'system'
        for (const tipo of ['sessionStorage', 'localStorage']) {
          try {
            const valor = window[tipo].getItem('cruxe:tema:v1')
            if (valor === 'light' || valor === 'dark' || valor === 'system') {
              modo = valor
              break
            }
          } catch {}
        }
        const tema = modo === 'system'
          ? (window.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : modo
        document.documentElement.dataset.theme = tema
        document.documentElement.style.colorScheme = tema
      })()
    </script>
    <title>CRUXE</title>
    <link rel="icon" type="image/svg+xml" href="/src/assets/cruxe-icono.svg" />
    <meta name="theme-color" content="#b4400f" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
